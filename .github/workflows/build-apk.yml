name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Unable to detect Java version." >&2
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not determine Java major version from $JAVA_VERSION." >&2
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR, which is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR ($JAVA_VERSION)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking temporary debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "./debug.keystore is missing. Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified successfully at ./debug.keystore."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Verifying APK at $EXPECTED_APK ==="
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK!" >&2
            echo "Searching only inside app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK $EXPECTED_APK is empty." >&2
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: Expected file $EXPECTED_APK does not have .apk extension." >&2; exit 1 ;;
          esac
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Debug APK verified successfully: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK release asset ==="
          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP_DIR="${RUNNER_TEMP}/release-asset-$(date +%s)"
          mkdir -p "$TMP_DIR"
          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="app"
          fi
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"
          cp "$VERIFIED_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH was not created or is empty." >&2
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH (Filename: $ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty." >&2
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset $ASSET_PATH does not have .apk extension." >&2; exit 1 ;;
          esac
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES=$(cat <<EOF
### Debug APK Build Details
- **Build Type:** Automatically generated debug APK
- **Built by:** GitHub Actions
- **Run Number:** ${GITHUB_RUN_NUMBER}
- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
- **Source Commit SHA:** ${GITHUB_SHA}
- **Testing Notice:** This APK is intended for testing and debugging.
- **Notice:** This is not a Play Store production release.
- **Signing:** Signed only with a temporary debug keystore.
EOF
          )
          echo "Publishing release $TAG_NAME with asset $ASSET_PATH..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download Result Summary ==="
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            echo "Release Tag: $RELEASE_TAG"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq .name)
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            echo "### 🚀 Debug APK Build & Release Successful" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to Download:** Download the APK directly from the **Assets** section of the release page on your mobile device or computer." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard GitHub Actions artifact (\`app-debug-apk\`) is also available from this workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped. Outcome: $RELEASE_OUTCOME"
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact name: app-debug-apk"
            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built and uploaded as a GitHub Actions artifact successfully, but GitHub Release creation encountered an issue or was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Download Option:** Download the APK from the GitHub Actions run summary page under **Artifacts** as \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          fi
